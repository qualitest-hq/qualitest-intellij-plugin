# qualitest-intellij-plugin Release
# 触发：推送 semver tag（v1.0.0 或 v1.1.0-rc.1）
# 产出：GitHub Release + build/distributions/*.zip
# 阶段 B：配置 PUBLISH_TOKEN 后自动 publishPlugin 到 JetBrains Marketplace

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Resolve tag version
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          if echo "${GITHUB_REF_NAME}" | grep -Eq -- '-rc|-beta|-alpha'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Validate tag matches Gradle version
        run: |
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          GRADLE_VERSION="$(./gradlew --no-configuration-cache -q printVersion)"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) != build.gradle.kts version ($GRADLE_VERSION)"
            exit 1
          fi

      - name: Full plugin verification matrix
        run: ./gradlew --no-configuration-cache test verifyPlugin -PverifyRecommended=true

      - name: Build distributable ZIP
        run: ./gradlew --no-configuration-cache buildPlugin

      - name: Extract change notes
        id: notes
        run: |
          NOTES="$(python3 <<'PY'
          import pathlib
          import re

          text = pathlib.Path("build.gradle.kts").read_text(encoding="utf-8")
          match = re.search(
              r'changeNotes\s*=\s*"""(.*?)"""\.trimIndent\(\)',
              text,
              re.DOTALL,
          )
          print(match.group(1).strip() if match else "See commit history.")
          PY
          )"
          {
            echo "body<<EOF"
            echo "## Qualitest Helper v${{ steps.tag.outputs.version }}"
            echo
            echo "**兼容 IDE**：2025.3+（\`pluginSinceBuild=253\`，见 \`gradle.properties\`）"
            echo
            echo "### 安装"
            echo "下载下方 ZIP → IntelliJ **Settings → Plugins → ⚙ → Install Plugin from Disk…**，重启 IDE。"
            echo
            echo "详细说明见 [README · 离线安装](https://github.com/${{ github.repository }}#打包与安装离线-zip)。"
            echo
            echo "### 变更说明"
            echo
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.tag.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: build/distributions/*.zip
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          generate_release_notes: false

  marketplace:
    name: marketplace
    needs: release
    # 阶段 B：配置 Org Secret PUBLISH_TOKEN 后，将 if 改为 true 或改用 repository variable 开关
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Ensure gradlew is executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew --no-configuration-cache publishPlugin
